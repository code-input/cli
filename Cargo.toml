[workspace]
members = ["codeinput", "ci"]
resolver = "2"

[workspace.dependencies]
# Shared dependencies
rand = { version = "0.10.0", default-features = false }
rayon = "1.11.0"
human-panic = "2.0.6"
better-panic = "0.3.0"
log = "0.4.29"
clap_complete = "4.5.66"
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = { version = "2.0.1", features = ["serde"] }
git2 = { version = "0.20.4", default-features = false }
sha2 = { version = "0.10.9" }
thiserror = "2.0.18"
backtrace = "0.3.76"
color-backtrace = "0.7.2"
config = "0.15.19"
lazy_static = "1.5.0"
slog = "2.8.2"
slog-syslog = "0.13.0"
slog-term = "2.9.2"
slog-scope = "4.4.1"
slog-async = "2.8.0"
slog-stdlog = "4.1.1"
tabled = "0.20.0"
terminal_size = "0.4.3"
clap = { version = "4.5.60", features = ["cargo", "derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
tower-lsp = "0.20"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5.8"

# Dev dependencies
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.26.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.dev]
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 4

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
